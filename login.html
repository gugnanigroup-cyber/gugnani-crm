<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gugnani Tyres CRM</title>
    <!-- Title & Open Graph Metadata for WhatsApp/Telegram Previews -->
    <meta property="og:title" content="Gugnani Tyres CRM - Lead Management">
    <meta property="og:description" content="Enterprise Lead Management System for Gugnani Tyres.">
    <meta property="og:image" content="https://gugnanigroup-cyber.github.io/gugnani-crm/assets/logo.png">
    <meta property="og:type" content="website">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        body.dark-mode {
            background-color: #121212;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .dark-mode .login-card {
            background-color: #1e1e1e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .brand-logo {
            font-size: 2.5rem;
            color: #dc3545;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <img src="assets/logo_wide.png" alt="Gugnani Tyres CRM" style="max-width: 100%; max-height: 120px; mix-blend-mode: multiply; filter: brightness(1.15) contrast(1.2);" class="mb-2">
            <p class="text-muted small">Sign in to your CRM account</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">Mobile Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                    <input type="text" class="form-control" id="mobile" placeholder="Enter mobile number" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small" for="rememberMe">Remember me</label>
                </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 fw-bold shadow-sm" id="btnLogin">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In
            </button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="js/config.js?v=46"></script>
    <script src="js/api.js?v=46"></script>
    <script src="js/auth.js?v=46"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Apply dark mode if user selected it previously
            if (localStorage.getItem('crm_theme') === 'dark') {
                document.body.classList.add('dark-mode');
            }

            // Redirect if already logged in
            if (Auth.isLoggedIn()) {
                window.location.href = 'dashboard.html';
            }

            const loginForm = document.getElementById('loginForm');
            const btnLogin = document.getElementById('btnLogin');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const mobile = document.getElementById('mobile').value.trim();
                const password = document.getElementById('password').value;
                const remember = document.getElementById('rememberMe').checked;
                
                if (!mobile || !password) return;
                
                btnLogin.disabled = true;
                btnLogin.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';
                
                await Auth.login(mobile, password, remember);
                
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In';
            });
        });
    </script>
</body>
</html>
